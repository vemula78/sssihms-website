// ── APP ───────────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variation": "Dignified Modern"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState(() => ((window.location.hash || '#home').slice(1)) || 'home');

  useEffect(() => {
    const onHash = () => { setPage(((window.location.hash || '#home').slice(1)) || 'home'); window.scrollTo({ top: 0, behavior: 'auto' }); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (p) => {
    if (((window.location.hash || '#home').slice(1) || 'home') === p) { setPage(p); window.scrollTo({ top: 0, behavior: 'auto' }); }
    window.location.hash = p;
  };

  const themeClass = tweaks.variation === 'Sacred Warmth' ? 'theme-a' : 'theme-b';

  const renderPage = () => {
    if (page === 'home') return <HomePage navigate={navigate} />;
    return window.ContentPage ? <window.ContentPage pageKey={page} navigate={navigate} /> : null;
  };

  return (
    <div className={themeClass}>
      <TopBar navigate={navigate} />
      <NavBar page={page} navigate={navigate} />
      {renderPage()}
      <Footer navigate={navigate} />
      <TweaksPanel title="Design Direction">
        <TweakSection label="Visual Theme" />
        <TweakSelect id="variation" label="Variation"
          options={['Sacred Warmth','Dignified Modern']}
          value={tweaks.variation}
          onChange={v => setTweak('variation', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
